<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Le Bistro du Coin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 { color: #1b4332; margin-bottom: 20px; text-align: center; }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #1b4332;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }
    button:hover { background: #2d6a4f; }
    .btn-danger { background: #b71c1c; margin-top: 5px; }
    .btn-danger:hover { background: #d32f2f; }
    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .product-img {
      width: 45px;
      height: 45px;
      border-radius: 6px;
      object-fit: cover;
      margin-right: 10px;
      background: #eee;
    }
    .product-details { display: flex; align-items: center; }
  </style>
</head>
<body>

  <h1>Manage Menu Products</h1>

  <div class="card">
    <h3 id="form-title">Add New Product</h3>
    <input type="hidden" id="prod-id" />
    
    <label>Product Name</label>
    <input type="text" id="prod-name" placeholder="e.g. Tusker Lager" />

    <label>Category</label>
    <select id="prod-category">
      <option value="Food">Food</option>
      <option value="Special Meals">Special Meals</option>
      <option value="Drinks">Drinks</option>
      <option value="Soft Drinks">Soft Drinks</option>
      <option value="Water">Water</option>
      <option value="Tea">Tea</option>
      <option value="Liqueurs">Liqueurs</option>
      <option value="Wine">Wine</option>
    </select>

    <label>Price (RWF)</label>
    <input type="number" id="prod-price" placeholder="e.g. 2500" />

    <label>Image URL (Optional)</label>
    <input type="text" id="prod-image" placeholder="https://example.com/photo.jpg" />

    <button id="save-btn" onclick="saveProduct()">Save Product</button>
  </div>

  <div class="card">
    <h3>Current Products</h3>
    <div id="product-list">Loading...</div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDRFE8T-BG7_PoLYgg9zQ1IhaMJ9LMZtqY",
      authDomain: "le-bistro-du-coin-menu.firebaseapp.com",
      projectId: "le-bistro-du-coin-menu",
      storageBucket: "le-bistro-du-coin-menu.firebasestorage.app",
      messagingSenderId: "898517850884",
      appId: "1:898517850884:web:306ef3ff30f919d38e8e51",
      measurementId: "G-M49VLSTXTV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const nameInput = document.getElementById('prod-name');
    const catInput = document.getElementById('prod-category');
    const priceInput = document.getElementById('prod-price');
    const imageInput = document.getElementById('prod-image');
    const idInput = document.getElementById('prod-id');
    const listContainer = document.getElementById('product-list');

    // Load Products
    db.collection("products").onSnapshot((snapshot) => {
      listContainer.innerHTML = '';
      snapshot.forEach((doc) => {
        const p = doc.data();
        const div = document.createElement('div');
        div.className = 'product-item';
        
        const imgTag = p.image ? `<img src="${p.image}" class="product-img">` : '';

        div.innerHTML = `
          <div class="product-details">
            ${imgTag}
            <div>
              <strong>${p.name}</strong><br>
              <small>${p.category} — ${Number(p.price).toLocaleString()} RWF</small>
            </div>
          </div>
          <div>
            <button style="padding:6px 12px; width:auto;" onclick="editProduct('${doc.id}', '${p.name}', '${p.category}', ${p.price}, '${p.image || ''}')">Edit</button>
            <button class="btn-danger" style="padding:6px 12px; width:auto;" onclick="deleteProduct('${doc.id}')">Delete</button>
          </div>
        `;
        listContainer.appendChild(div);
      });
    });

    // Save or Update Product
    async function saveProduct() {
      const name = nameInput.value.trim();
      const category = catInput.value;
      const price = Number(priceInput.value);
      const image = imageInput.value.trim();
      const id = idInput.value;

      if (!name || !price) {
        alert("Please enter both a name and price.");
        return;
      }

      if (id) {
        await db.collection("products").doc(id).update({ name, category, price, image });
      } else {
        await db.collection("products").add({ name, category, price, image });
      }

      resetForm();
    }

    function editProduct(id, name, category, price, image) {
      idInput.value = id;
      nameInput.value = name;
      catInput.value = category;
      priceInput.value = price;
      imageInput.value = image;
      document.getElementById('form-title').textContent = "Edit Product";
    }

    async function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this item?")) {
        await db.collection("products").doc(id).delete();
      }
    }

    function resetForm() {
      idInput.value = '';
      nameInput.value = '';
      priceInput.value = '';
      imageInput.value = '';
      document.getElementById('form-title').textContent = "Add New Product";
    }
  </script>
</body>
</html>
