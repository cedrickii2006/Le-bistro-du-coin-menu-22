<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Bistro du Coin — Digital Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
      font-style: italic;
    }
    .category-title {
      color: #d4af37;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
      margin-top: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px stroke #222;
    }
    .item-name {
      font-weight: bold;
    }
    .item-price {
      color: #d4af37;
      font-weight: bold;
    }
    #loading {
      text-align: center;
      color: #888;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <h1>Le Bistro du Coin</h1>
  <div class="subtitle">Digital Menu</div>

  <div id="loading">Loading menu items...</div>
  <div id="menu-container"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDRFE8T-BG7_PoLYgg9zQ1IhaMJ9LMZtqY",
      authDomain: "le-bistro-du-coin-menu.firebaseapp.com",
      projectId: "le-bistro-du-coin-menu",
      storageBucket: "le-bistro-du-coin-menu.firebasestorage.app",
      messagingSenderId: "898517850884",
      appId: "1:898517850884:web:306ef3ff30f919d38e8e51",
      measurementId: "G-M49VLSTXTV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const menuContainer = document.getElementById('menu-container');
    const loading = document.getElementById('loading');

    // Real-time synchronization
    db.collection("products").onSnapshot((snapshot) => {
      loading.style.display = 'none';
      menuContainer.innerHTML = '';

      if (snapshot.empty) {
        menuContainer.innerHTML = '<p style="text-align:center;">No items found.</p>';
        return;
      }

      // Group products by category
      const categories = {};
      snapshot.forEach((doc) => {
        const p = doc.data();
        const cat = p.category || 'Other';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(p);
      });

      // Display categories and products
      for (const cat in categories) {
        const catHeader = document.createElement('h2');
        catHeader.className = 'category-title';
        catHeader.textContent = cat;
        menuContainer.appendChild(catHeader);

        categories[cat].forEach((item) => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'menu-item';
          
          const formattedPrice = Number(item.price).toLocaleString();

          itemDiv.innerHTML = `
            <span class="item-name">${item.name}</span>
            <span class="item-price">${formattedPrice} RWF</span>
          `;
          menuContainer.appendChild(itemDiv);
        });
      }
    });
  </script>
</body>
</html>
