<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Bistro du Coin — Digital Menu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 2px solid #333;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 2.2rem;
      color: #d4af37;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    header p {
      color: #888;
      font-style: italic;
      margin-top: 5px;
    }
    /* Category Filter Navigation Bar */
    .filter-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 25px;
      scrollbar-width: thin;
      scrollbar-color: #d4af37 #1e1e1e;
    }
    .filter-btn {
      background: #1e1e1e;
      color: #bbb;
      border: 1px solid #333;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #d4af37;
      color: #121212;
      border-color: #d4af37;
      font-weight: bold;
    }
    .category-section {
      margin-bottom: 35px;
    }
    .category-title {
      font-size: 1.3rem;
      color: #d4af37;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 600px) {
      .menu-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .menu-card {
      background: #1e1e1e;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .menu-card:hover {
      border-color: #d4af37;
      transform: translateY(-2px);
    }
    .item-image {
      width: 55px;
      height: 55px;
      border-radius: 6px;
      object-fit: cover;
      background: #2a2a2a;
      flex-shrink: 0;
    }
    .item-info {
      flex: 1;
    }
    .item-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
    }
    .item-desc {
      font-size: 0.8rem;
      color: #999;
      margin-top: 3px;
    }
    .item-price {
      font-weight: bold;
      color: #d4af37;
      font-size: 1rem;
      white-space: nowrap;
      margin-left: 10px;
    }
    #loading {
      text-align: center;
      padding: 50px;
      color: #d4af37;
      font-size: 1.2rem;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #222;
      color: #666;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Le Bistro du Coin</h1>
    <p>Digital Menu</p>
  </header>

  <!-- Quick Category Filter Bar -->
  <div id="filter-container" class="filter-nav"></div>

  <div id="loading">Loading menu...</div>
  <div id="menu-container"></div>

  <footer>
    <p>DIGITAL MENU • I•G•D</p>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDRFE8T-BG7_PoLYgg9zQ1IhaMJ9LMZtqY",
      authDomain: "le-bistro-du-coin-menu.firebaseapp.com",
      projectId: "le-bistro-du-coin-menu",
      storageBucket: "le-bistro-du-coin-menu.firebasestorage.app",
      messagingSenderId: "898517850884",
      appId: "1:898517850884:web:306ef3ff30f919d38e8e51",
      measurementId: "G-M49VLSTXTV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const menuContainer = document.getElementById('menu-container');
    const filterContainer = document.getElementById('filter-container');
    const loading = document.getElementById('loading');

    const categoryIcons = {
      "Food": "🍽️",
      "Special Meals": "⭐",
      "Drinks": "🍺",
      "Soft Drinks": "🥤",
      "Water": "💧",
      "Tea": "☕",
      "Liqueurs": "🍾",
      "Wine": "🍷"
    };

    let allProducts = [];
    let currentCategory = 'All';

    db.collection("products").onSnapshot((snapshot) => {
      loading.style.display = 'none';
      allProducts = [];

      snapshot.forEach((doc) => {
        allProducts.push({ id: doc.id, ...doc.data() });
      });

      renderMenu();
    });

    function renderMenu() {
      menuContainer.innerHTML = '';
      filterContainer.innerHTML = '';

      if (allProducts.length === 0) {
        menuContainer.innerHTML = '<p style="text-align:center;">No items found.</p>';
        return;
      }

      // Extract unique categories
      const categories = ['All', ...new Set(allProducts.map(p => p.category || 'Other'))];

      // Build Category Filter Buttons
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `filter-btn ${currentCategory === cat ? 'active' : ''}`;
        const icon = categoryIcons[cat] || (cat === 'All' ? '📋' : '');
        btn.textContent = `${icon} ${cat}`.trim();
        btn.onclick = () => {
          currentCategory = cat;
          renderMenu();
        };
        filterContainer.appendChild(btn);
      });

      // Filter products based on selection
      const filtered = currentCategory === 'All' 
        ? allProducts 
        : allProducts.filter(p => (p.category || 'Other') === currentCategory);

      // Group by category for display
      const grouped = {};
      filtered.forEach(p => {
        const cat = p.category || 'Other';
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(p);
      });

      // Render sections
      for (const cat in grouped) {
        const section = document.createElement('div');
        section.className = 'category-section';

        const icon = categoryIcons[cat] || '📋';
        section.innerHTML = `<h2 class="category-title"><span>${icon}</span> ${cat}</h2>`;

        const grid = document.createElement('div');
        grid.className = 'menu-grid';

        grouped[cat].forEach(item => {
          const card = document.createElement('div');
          card.className = 'menu-card';

          const formattedPrice = Number(item.price).toLocaleString();
          const descHtml = item.description ? `<div class="item-desc">${item.description}</div>` : '';
          
          // Image handling (if an image URL or base64 is added in the future)
          const imgHtml = item.image 
            ? `<img src="${item.image}" class="item-image" alt="${item.name}">` 
            : '';

          card.innerHTML = `
            ${imgHtml}
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              ${descHtml}
            </div>
            <div class="item-price">${formattedPrice} RWF</div>
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        menuContainer.appendChild(section);
      }
    }
  </script>
</body>
</html>
