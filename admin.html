<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Le Bistro du Coin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 2px solid #333;
      margin-bottom: 25px;
    }
    header h1 {
      font-size: 2rem;
      color: #d4af37;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    header p {
      color: #888;
      font-style: italic;
      margin-top: 5px;
    }
    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      margin-bottom: 25px;
    }
    .card h3 {
      color: #d4af37;
      margin-bottom: 15px;
      font-size: 1.2rem;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      background-color: #121212;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #d4af37;
    }
    button {
      background: #d4af37;
      color: #121212;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 15px;
      transition: background 0.2s;
    }
    button:hover { background: #c29f2e; }
    .btn-danger {
      background: #b71c1c;
      color: #fff;
    }
    .btn-danger:hover { background: #d32f2f; }
    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .product-img {
      width: 45px;
      height: 45px;
      border-radius: 6px;
      object-fit: cover;
      margin-right: 12px;
      background: #2a2a2a;
    }
    .product-details {
      display: flex;
      align-items: center;
      flex: 1;
    }
    .product-info strong {
      color: #fff;
      font-size: 0.95rem;
    }
    .product-info small {
      color: #888;
      font-size: 0.8rem;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .actions button {
      margin-top: 0;
      padding: 6px 12px;
      font-size: 0.85rem;
      width: auto;
    }
    #loading {
      text-align: center;
      padding: 20px;
      color: #d4af37;
    }
  </style>
</head>
<body>

  <header>
    <h1>Le Bistro du Coin</h1>
    <p>Admin Management Dashboard</p>
  </header>

  <div class="card">
    <h3 id="form-title">Add New Product</h3>
    <input type="hidden" id="prod-id" />
    
    <label>Product Name</label>
    <input type="text" id="prod-name" placeholder="e.g. Tusker Lager" />

    <label>Category</label>
    <select id="prod-category">
      <option value="Food">Food</option>
      <option value="Special Meals">Special Meals</option>
      <option value="Drinks">Drinks</option>
      <option value="Soft Drinks">Soft Drinks</option>
      <option value="Water">Water</option>
      <option value="Tea">Tea</option>
      <option value="Liqueurs">Liqueurs</option>
      <option value="Wine">Wine</option>
    </select>

    <label>Price (RWF)</label>
    <input type="number" id="prod-price" placeholder="e.g. 2500" />

    <label>Image URL (Optional)</label>
    <input type="text" id="prod-image" placeholder="https://example.com/photo.jpg" />

    <button id="save-btn" onclick="saveProduct()">Save Product</button>
  </div>

  <div class="card">
    <h3>Current Products</h3>
    <div id="product-list"><div id="loading">Loading products...</div></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDRFE8T-BG7_PoLYgg9zQ1IhaMJ9LMZtqY",
      authDomain: "le-bistro-du-coin-menu.firebaseapp.com",
      projectId: "le-bistro-du-coin-menu",
      storageBucket: "le-bistro-du-coin-menu.firebasestorage.app",
      messagingSenderId: "898517850884",
      appId: "1:898517850884:web:306ef3ff30f919d38e8e51",
      measurementId: "G-M49VLSTXTV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const nameInput = document.getElementById('prod-name');
    const catInput = document.getElementById('prod-category');
    const priceInput = document.getElementById('prod-price');
    const imageInput = document.getElementById('prod-image');
    const idInput = document.getElementById('prod-id');
    const listContainer = document.getElementById('product-list');

    // Load Products
    db.collection("products").onSnapshot((snapshot) => {
      listContainer.innerHTML = '';
      if (snapshot.empty) {
        listContainer.innerHTML = '<p style="text-align:center; color:#888;">No products found.</p>';
        return;
      }

      snapshot.forEach((doc) => {
        const p = doc.data();
        const div = document.createElement('div');
        div.className = 'product-item';
        
        const imgTag = p.image ? `<img src="${p.image}" class="product-img" alt="${p.name}">` : '<div class="product-img"></div>';

        div.innerHTML = `
          <div class="product-details">
            ${imgTag}
            <div class="product-info">
              <strong>${p.name}</strong><br>
              <small>${p.category} — ${Number(p.price).toLocaleString()} RWF</small>
            </div>
          </div>
          <div class="actions">
            <button onclick="editProduct('${doc.id}', '${p.name.replace(/'/g, "\\'")}', '${p.category}', ${p.price}, '${(p.image || '').replace(/'/g, "\\'")}')">Edit</button>
            <button class="btn-danger" onclick="deleteProduct('${doc.id}')">Delete</button>
          </div>
        `;
        listContainer.appendChild(div);
      });
    });

    // Save or Update Product
    async function saveProduct() {
      const name = nameInput.value.trim();
      const category = catInput.value;
      const price = Number(priceInput.value);
      const image = imageInput.value.trim();
      const id = idInput.value;

      if (!name || !price) {
        alert("Please enter both a name and price.");
        return;
      }

      if (id) {
        await db.collection("products").doc(id).update({ name, category, price, image });
      } else {
        await db.collection("products").add({ name, category, price, image });
      }

      resetForm();
    }

    function editProduct(id, name, category, price, image) {
      idInput.value = id;
      nameInput.value = name;
      catInput.value = category;
      priceInput.value = price;
      imageInput.value = image;
      document.getElementById('form-title').textContent = "Edit Product";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this item?")) {
        await db.collection("products").doc(id).delete();
      }
    }

    function resetForm() {
      idInput.value = '';
      nameInput.value = '';
      priceInput.value = '';
      imageInput.value = '';
      document.getElementById('form-title').textContent = "Add New Product";
    }
  </script>
</body>
</html>
