
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le Bistro du Coin | Admin</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #25251f;
    }
    header {
      background: #183c32;
      color: #fff;
      padding: 24px;
      text-align: center;
    }
    main {
      max-width: 800px;
      margin: 25px auto;
      padding: 20px;
    }
    section {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px #00000012;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #183c32;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button.delete { background: #9e3028; }
    button.secondary { background: #666; }
    .product {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }
    .product strong { display: block; }
    .hidden { display: none; }
    #message { white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>Le Bistro du Coin</h1>
    <p>Menu Administration</p>
  </header>

  <main>
    <section id="loginPanel">
      <h2>Administrator Login</h2>
      <p>Sign in using your administrator email and password.</p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Admin email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
      </form>
    </section>

    <p id="message" role="status"></p>

    <section id="dashboard" class="hidden">
      <h2>Manage Products</h2>
      <p>Add a product or select an existing product below to edit it.</p>

      <form id="productForm">
        <input id="productName" placeholder="Product name" required>
        <input id="productCategory" placeholder="Category (e.g. Soft Drinks)" required>
        <input id="productPrice" type="number" min="0" step="1"
          placeholder="Price in RWF" required>
        <button type="submit">Save Product</button>
        <button type="button" id="cancelEdit" class="secondary hidden">
          Cancel Edit
        </button>
      </form>

      <h2>Current Products</h2>
      <div id="products">Loading products...</div>
      <button id="logout" class="secondary">Sign Out</button>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDRFE8T-BG7_PoLYgg9zQ1IhaMJ9LMZtqY",
      authDomain: "le-bistro-du-coin-menu.firebaseapp.com",
      projectId: "le-bistro-du-coin-menu",
      storageBucket: "le-bistro-du-coin-menu.firebasestorage.app",
      messagingSenderId: "898517850884",
      appId: "1:898517850884:web:306ef3ff30f919d38e8e51",
      measurementId: "G-M49VLSTXTV"
    };

    const ADMIN_UID = "8eNByq2V8hf84yXb8MnaD6ZmnWr2";

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const loginPanel = document.getElementById("loginPanel");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");
    const productsDiv = document.getElementById("products");
    const productForm = document.getElementById("productForm");
    const cancelEdit = document.getElementById("cancelEdit");

    let editingId = null;
    let unsubscribeProducts = null;

    function showMessage(text) {
      message.textContent = text;
    }

    function resetForm() {
      productForm.reset();
      editingId = null;
      productForm.querySelector('button[type="submit"]').textContent =
        "Save Product";
      cancelEdit.classList.add("hidden");
    }

    function stopProductListener() {
      if (unsubscribeProducts) {
        unsubscribeProducts();
        unsubscribeProducts = null;
      }
    }

    auth.onAuthStateChanged(async user => {
      stopProductListener();
      loginPanel.classList.remove("hidden");
      dashboard.classList.add("hidden");

      if (!user) {
        showMessage("");
        return;
      }

      if (user.uid !== ADMIN_UID) {
        await auth.signOut();
        showMessage("This account is not authorized as the menu administrator.");
        return;
      }

      loginPanel.classList.add("hidden");
      dashboard.classList.remove("hidden");
      showMessage("Signed in successfully.");

      unsubscribeProducts = db.collection("products")
        .onSnapshot(snapshot => {
          productsDiv.replaceChildren();

          if (snapshot.empty) {
            productsDiv.textContent = "No products have been added yet.";
            return;
          }

          snapshot.forEach(doc => {
            const item = doc.data();
            const row = document.createElement("div");
            row.className = "product";

            const name = document.createElement("strong");
            name.textContent = item.name || "Unnamed product";

            const details = document.createElement("p");
            details.textContent =
              (item.category || "Uncategorised") + " — " +
              Number(item.price || 0).toLocaleString() + " RWF";

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.onclick = () => {
              editingId = doc.id;
              document.getElementById("productName").value = item.name || "";
              document.getElementById("productCategory").value =
                item.category || "";
              document.getElementById("productPrice").value = item.price ?? "";
              productForm.querySelector('button[type="submit"]').textContent =
                "Update Product";
              cancelEdit.classList.remove("hidden");
              window.scrollTo({ top: 0, behavior: "smooth" });
            };

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";
            deleteButton.onclick = async () => {
              if (!confirm("Delete " + (item.name || "this product") + "?")) {
                return;
              }
              try {
                await db.collection("products").doc(doc.id).delete();
                showMessage("Product deleted.");
              } catch (error) {
                showMessage("Could not delete product: " + error.message);
              }
            };

            row.append(name, details, editButton, deleteButton);
            productsDiv.appendChild(row);
          });
        }, error => {
          showMessage("Could not load products: " + error.message);
        });
    });

    document.getElementById("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      showMessage("Signing in...");
      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
      } catch (error) {
        showMessage("Sign-in failed. Check your email and password.");
      }
    });

    productForm.addEventListener("submit", async e => {
      e.preventDefault();

      const name = document.getElementById("productName").value.trim();
      const category = document.getElementById("productCategory").value.trim();
      const price = Number(document.getElementById("productPrice").value);

      if (!name || !category || !Number.isFinite(price) || price < 0) {
        showMessage("Enter a product name, category, and valid price.");
        return;
      }

      const user = auth.currentUser;
      if (!user || user.uid !== ADMIN_UID) {
        showMessage("Please sign in with the administrator account.");
        return;
      }

      try {
        const data = { name, category, price };
        if (editingId) {
          await db.collection("products").doc(editingId).update(data);
          showMessage("Product updated successfully.");
        } else {
          await db.collection("products").add(data);
          showMessage("Product added successfully.");
        }
        resetForm();
      } catch (error) {
        showMessage("Could not save product: " + error.message);
      }
    });

    cancelEdit.addEventListener("click", resetForm);

    document.getElementById("logout").addEventListener("click", async () => {
      resetForm();
      stopProductListener();
      await auth.signOut();
    });
  </script>
</body>
</html>
